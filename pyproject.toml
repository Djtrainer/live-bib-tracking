# pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "live-bib-tracking"
version = "0.1.0"
description = "A project for racer bib identification, reading and tracking"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    # Computer vision pipeline
    "ultralytics>=8.3.0",          # YOLO11 weights need >=8.3; 8.1.x cannot load them
    "opencv-python>=4.10",
    "easyocr>=1.7.1",
    "torch>=2.5",
    "torchvision>=0.20",
    "numpy>=2.0",
    "coremltools>=8.0",            # required to load the .mlpackage race model on macOS
    # API backend
    "fastapi>=0.115,<1",
    "starlette<1",                 # 1.0 removed Router(on_startup=...); FastAPI <0.120 still passes it
    "uvicorn>=0.30",
    "websockets>=12",              # uvicorn's WebSocket implementation for /ws
    "python-multipart>=0.0.9",     # required by FastAPI for UploadFile
    # Shared
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
race-cv = "race_cv.run:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
