    .sponsors { margin-top: 5vh; }
    .sponsors h2 { color: var(--purple); font-size: clamp(16px, 2vw, 26px); letter-spacing: .08em;

    .learn-more { margin-top: 3vh; font-size: clamp(15px, 1.8vw, 22px); color: var(--muted); }
